backend:
  name: github
  repo: leah-kong/Streamax-Knowledge-Base
  branch: main
  base_url: https://api.github.com

media_folder: public/uploads
public_folder: /uploads

# 双语做法：不使用 Sveltia 的 i18n 语言切换器，改为每个双语字段做成一个
# “ES / EN”分组（object 控件），与仓库里 src/content 的 `字段: {es, en}` 格式对齐。
# 这样后台能直接显示并编辑现有条目，且不影响 Astro 站点（站点只读 src/content，不看本文件）。

collections:
  - name: categories
    label: Categorías / Categories
    folder: src/content/categories
    extension: yml
    create: true
    fields:
      - name: name
        label: Nombre (ES / EN)
        widget: object
        fields:
          - { label: ES, name: es, widget: string }
          - { label: EN, name: en, widget: string }
      - label: Nivel
        name: level
        widget: select
        options:
          - { label: 'Nivel 1 (categoría principal)', value: 1 }
          - { label: 'Nivel 2 (pestaña)', value: 2 }
          - { label: 'Nivel 3 (agrupación)', value: 3 }
      - { label: Categoría padre, name: parent, widget: relation, collection: categories, search_fields: [name], value_field: name, display_fields: [name], required: false }
      - { label: Orden, name: order, widget: number, value_type: int, default: 99, required: false }
      - name: summary
        label: Descripción (ES / EN)
        widget: object
        fields:
          - { label: ES, name: es, widget: text }
          - { label: EN, name: en, widget: text }

  - name: products
    label: Productos / Products
    folder: src/content/products
    extension: yml
    create: true
    identifier_field: model
    fields:
      - { label: Modelo, name: model, widget: string }
      - name: name
        label: Nombre (ES / EN)
        widget: object
        fields:
          - { label: ES, name: es, widget: string }
          - { label: EN, name: en, widget: string }
      - name: series
        label: Serie (ES / EN)
        widget: object
        required: false
        fields:
          - { label: ES, name: es, widget: string }
          - { label: EN, name: en, widget: string }
      - { label: 'Categoría (nivel 1)', name: category, widget: relation, collection: categories, search_fields: [name], value_field: name, display_fields: [name] }
      - { label: 'Subcategoría (nivel 2)', name: subcategory, widget: relation, collection: categories, search_fields: [name], value_field: name, display_fields: [name], required: false }
      - { label: 'Agrupación (nivel 3)', name: platform, widget: relation, collection: categories, search_fields: [name], value_field: name, display_fields: [name], required: false }
      - { label: Imagen, name: image, widget: image, required: false }
      - { label: Orden, name: order, widget: number, value_type: int, default: 99, required: false }
      - { label: 'Fin de vida (EOL)', name: eol, widget: boolean, default: false, required: false }
      - label: 'Productos relacionados (manual)'
        name: related
        widget: relation
        collection: products
        multiple: true
        search_fields: [model]
        display_fields: [model]
        required: false
        hint: 'Selecciona manualmente los productos relacionados. Tienen prioridad sobre la asociación automática por categoría.'

      - label: 'Documentos anidados (manuals)'
        name: manuals
        widget: list
        required: false
        summary: '{{fields.docType}} — {{fields.title.en}}'
        fields:
          - label: Tipo de documento
            name: docType
            widget: select
            options:
              - { label: Datasheet, value: datasheet }
              - { label: 'User Guide', value: user-guide }
              - { label: 'Wiring Diagram', value: wiring-diagram }
              - { label: Certification, value: certification }
          - name: title
            label: Título (ES / EN)
            widget: object
            required: false
            fields:
              - { label: ES, name: es, widget: string }
              - { label: EN, name: en, widget: string }
          - { label: Versión, name: version, widget: string, required: false }
          - { label: Fecha, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, required: false }
          - { label: 'Archivo ES (URL)', name: fileEs, widget: string, required: false }
          - { label: 'Archivo EN (URL)', name: fileEn, widget: string, required: false }
          - { label: 'Enlace externo', name: externalUrl, widget: string, required: false }
          - name: summary
            label: Resumen (ES / EN)
            widget: object
            required: false
            fields:
              - { label: ES, name: es, widget: text }
              - { label: EN, name: en, widget: text }
      - label: 'Firmware anidado (firmware)'
        name: firmware
        widget: list
        required: false
        summary: '{{fields.version}}'
        fields:
          - { label: Versión, name: version, widget: string }
          - { label: Fecha, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, required: false }
          - label: Tipo
            name: type
            widget: select
            options:
              - { label: Firmware, value: firmware }
              - { label: Herramienta, value: tool }
            default: firmware
          - { label: 'Tamaño del archivo', name: fileSize, widget: string, required: false }
          - { label: Checksum, name: checksum, widget: string, required: false }
          - { label: 'URL de descarga', name: downloadUrl, widget: string, required: false }
          - name: releaseNotes
            label: Notas de versión (ES / EN)
            widget: object
            required: false
            fields:
              - { label: ES, name: es, widget: text }
              - { label: EN, name: en, widget: text }
          - { label: 'Actualización obligatoria', name: mandatory, widget: boolean, default: false, required: false }
      - label: 'Videos anidados (videos)'
        name: videos
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Fecha, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, required: false }
          - { label: Duración, name: duration, widget: string, required: false }
          - { label: 'URL del video', name: url, widget: string, required: false }
          - { label: 'Enlace externo', name: external, widget: boolean, default: true, required: false }
          - { label: Portada, name: cover, widget: string, required: false }
          - { label: Resumen, name: summary, widget: string, required: false }

  - name: manual
    label: Manuales / Manuals
    folder: src/content/manual
    extension: yml
    create: true
    fields:
      - name: title
        label: Título (ES / EN)
        widget: object
        fields:
          - { label: ES, name: es, widget: string }
          - { label: EN, name: en, widget: string }
      - label: Tipo de documento
        name: docType
        widget: select
        options:
          - { label: Datasheet, value: datasheet }
          - { label: 'User Guide', value: user-guide }
          - { label: 'Wiring Diagram', value: wiring-diagram }
          - { label: Certification, value: certification }
      - { label: Productos, name: products, widget: relation, collection: products, multiple: true, search_fields: [model], display_fields: [model] }
      - { label: Versión, name: version, widget: string, required: false }
      - { label: Fecha, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: 'Archivo ES (URL)', name: fileEs, widget: string, required: false, hint: 'URL del PDF en español, por ejemplo un asset de GitHub Releases' }
      - { label: 'Archivo EN (URL)', name: fileEn, widget: string, required: false }
      - { label: 'Enlace externo', name: externalUrl, widget: string, required: false, hint: 'Enlace a Google Drive (o cualquier URL externa). Se muestra como botón "Abrir" en la ficha del producto.' }
      - name: summary
        label: Resumen (ES / EN)
        widget: object
        required: false
        fields:
          - { label: ES, name: es, widget: text }
          - { label: EN, name: en, widget: text }

  - name: firmware
    label: 'Firmware y herramientas'
    folder: src/content/firmware
    extension: yml
    create: true
    identifier_field: version
    fields:
      - { label: Versión, name: version, widget: string }
      - { label: Productos, name: products, widget: relation, collection: products, multiple: true, search_fields: [model], display_fields: [model] }
      - { label: Fecha, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - label: Tipo
        name: type
        widget: select
        options:
          - { label: Firmware, value: firmware }
          - { label: Herramienta, value: tool }
        default: firmware
      - { label: 'Tamaño del archivo', name: fileSize, widget: string, required: false }
      - { label: Checksum, name: checksum, widget: string, required: false }
      - { label: 'URL de descarga', name: downloadUrl, widget: string, hint: 'Enlace directo al asset de GitHub Releases' }
      - name: releaseNotes
        label: Notas de versión (ES / EN)
        widget: object
        required: false
        fields:
          - { label: ES, name: es, widget: text }
          - { label: EN, name: en, widget: text }
      - { label: 'Actualización obligatoria', name: mandatory, widget: boolean, default: false, required: false }

  - name: video
    label: Videos
    folder: src/content/video
    extension: yml
    create: true
    fields:
      - name: title
        label: Título (ES / EN)
        widget: object
        fields:
          - { label: ES, name: es, widget: string }
          - { label: EN, name: en, widget: string }
      - { label: Productos, name: products, widget: relation, collection: products, multiple: true, search_fields: [model], display_fields: [model] }
      - { label: Fecha, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Duración, name: duration, widget: string, required: false }
      - { label: 'URL del video', name: url, widget: string, hint: 'Enlace de YouTube (se incrusta el reproductor) u otra URL de video externa.' }
      - { label: 'Enlace externo', name: external, widget: boolean, default: true, required: false }
      - { label: Portada, name: cover, widget: string, required: false }
      - name: summary
        label: Resumen (ES / EN)
        widget: object
        required: false
        fields:
          - { label: ES, name: es, widget: text }
          - { label: EN, name: en, widget: text }

