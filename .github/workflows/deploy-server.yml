name: Deploy to Private Server

# 仅手动触发；不影响 GitHub Pages 的自动部署
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "正式站点地址，如 https://kb.example.com"
        required: true
      base_path:
        description: "站点根路径；独立域名填 /"
        required: true
        default: "/"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build site (server mode)
        env:
          SITE_URL: ${{ inputs.site_url }}
          BASE_PATH: ${{ inputs.base_path }}
        run: |
          npx astro build
          npx pagefind --site dist --output-subdir search

      - name: Deploy via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          # 预检：缺任一密钥直接报清晰错误，避免得到难懂的 255
          : "${SSH_KEY:?Falta el secret DEPLOY_SSH_KEY (clave privada SSH, con saltos de linea reales)}"
          : "${HOST:?Falta el secret DEPLOY_HOST (p.ej. 203.0.113.10)}"
          : "${USER:?Falta el secret DEPLOY_USER (p.ej. deploy)}"
          : "${TARGET:?Falta el secret DEPLOY_PATH (ruta absoluta, p.ej. /var/www/kb)}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # heredoc 写私钥，能正确处理多行；结尾补一个换行避免某些客户端报错
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 信任主机密钥（避免 known_hosts 校验失败）；失败不阻断
          ssh-keyscan -p 22 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo ">> Probando conexion SSH a $USER@$HOST ..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$USER@$HOST" "echo CONEXION_OK; uname -a"

          echo ">> Rsync dist/ -> $USER@$HOST:$TARGET"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            dist/ "$USER@$HOST:$TARGET"

          echo ">> Recargando nginx"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$USER@$HOST" "sudo nginx -t && sudo systemctl reload nginx" || echo "nginx reload omitido (sin sudo o no es nginx)"
